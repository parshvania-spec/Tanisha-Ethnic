name: Apply Light Premium Homepage

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-light-homepage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply approved light premium theme
        shell: bash
        run: |
          cat >> styles.css <<'EOF'

/* Approved Light Premium Homepage */
:root{--light-ivory:#fffaf3;--light-paper:#fffdf9;--light-cream:#f8efe5;--light-brown:#4b2b1c;--light-gold:#b88943;--light-line:#ead9c7}
body{background:var(--light-ivory);color:var(--light-brown)}
.offerBar{background:linear-gradient(90deg,#f4e7d8,#fffaf3,#f4e7d8);color:#70461f;border-bottom:1px solid var(--light-line)}
.siteHeader{background:rgba(255,253,249,.97);border-bottom:1px solid var(--light-line);box-shadow:0 8px 24px rgba(75,43,28,.06)}
.siteHeader nav a{color:#5a3825}
.heroSlider{background:#f6ede3;border-bottom:1px solid var(--light-line)}
.slide{color:var(--light-brown);background:linear-gradient(90deg,#fffaf3,#f7eee4 54%,#efe0d1)}
.slide h1{color:#5a351e;text-shadow:none}
.slide p{color:#684b38}
.heroActions .primaryBtn{background:linear-gradient(135deg,#a97530,#c89b50);color:#fffaf3}
.heroActions .secondaryBtn{background:#fffdf9;border-color:#bfa27f;color:#6a4426}
.trustRow{background:#fffdf9;border-bottom:1px solid var(--light-line)}
.section{background:var(--light-ivory)}
.section.soft,.wishlistSection{background:var(--light-cream)}
.productCard{background:var(--light-paper);border-color:var(--light-line);box-shadow:0 10px 26px rgba(75,43,28,.07)}
.productCard:hover{box-shadow:0 18px 38px rgba(75,43,28,.12)}
.wishBtn{background:var(--light-paper);border-color:#e3d0bc;color:#704526}
.addCartBtn{background:linear-gradient(135deg,#f6e9db,#ead8c4);border-color:#d4b897;color:#5a341f}
.categories button{background:var(--light-paper);border-color:#d9c2a8;color:#604027}.categories button.active{background:#6a4126}
.reviewsSection{background:var(--light-paper)}
.reviewCard{background:#fffaf4;border-color:var(--light-line)}
@media(max-width:900px){.slide{background:linear-gradient(180deg,#fffaf3,#f5e8dc);padding-top:42px}.slide h1{font-size:52px}.slideVisual{opacity:1}.heroSlider{min-height:680px}}
@media(max-width:560px){.heroSlider{min-height:640px}.slide{padding:34px 14px 56px}.slide h1{font-size:39px}.slideVisual img{width:min(94%,360px)}}
EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          if git diff --cached --quiet; then echo "Light theme already applied"; exit 0; fi
          git commit -m "feat: apply approved light premium homepage"
          git push
