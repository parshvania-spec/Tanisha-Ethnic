name: Premium Luxury UI Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  premium-ui-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify storefront styling
        shell: bash
        run: |
          test -f styles.css
          grep -q "Premium V5 permanent logo and SVG icon system" styles.css
          echo "Premium Luxury UI is present."
